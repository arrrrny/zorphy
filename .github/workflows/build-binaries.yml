name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            cli_output: zorphy-macos-arm64
            mcp_output: zorphy_mcp_server-macos-arm64
          - os: macos-13
            platform: macos-x64
            cli_output: zorphy-macos-x64
            mcp_output: zorphy_mcp_server-macos-x64
          - os: ubuntu-latest
            platform: linux-x64
            cli_output: zorphy-linux-x64
            mcp_output: zorphy_mcp_server-linux-x64
          - os: windows-latest
            platform: windows-x64
            cli_output: zorphy-windows-x64.exe
            mcp_output: zorphy_mcp_server-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get
        working-directory: zorphy

      - name: Build CLI binary
        run: dart compile exe bin/zorphy_cli.dart -o ${{ matrix.cli_output }}
        working-directory: zorphy

      - name: Build MCP server binary
        run: dart compile exe bin/zorphy_mcp_server.dart -o ${{ matrix.mcp_output }}
        working-directory: zorphy

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.cli_output }}.tar.gz ${{ matrix.cli_output }}
          tar -czf ${{ matrix.mcp_output }}.tar.gz ${{ matrix.mcp_output }}
        working-directory: zorphy

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path ${{ matrix.cli_output }} -DestinationPath ${{ matrix.cli_output }}.zip
          Compress-Archive -Path ${{ matrix.mcp_output }} -DestinationPath ${{ matrix.mcp_output }}.zip
        working-directory: zorphy

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            zorphy/${{ matrix.cli_output }}
            zorphy/${{ matrix.cli_output }}.tar.gz
            zorphy/${{ matrix.cli_output }}.zip
            zorphy/${{ matrix.mcp_output }}
            zorphy/${{ matrix.mcp_output }}.tar.gz
            zorphy/${{ matrix.mcp_output }}.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zorphy/${{ matrix.cli_output }}.tar.gz
            zorphy/${{ matrix.cli_output }}.zip
            zorphy/${{ matrix.mcp_output }}.tar.gz
            zorphy/${{ matrix.mcp_output }}.zip
          fail_on_unmatched_files: false
