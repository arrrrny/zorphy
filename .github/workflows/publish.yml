name: Publish to Pub.dev

on:
  push:
    tags:
      - "v*"
      - "annotation-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for authentication with pub.dev via OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      - name: Publish zorphy_annotation
        if: startsWith(github.ref, 'refs/tags/annotation-v')
        run: |
          cd zorphy_annotation
          dart pub get
          dart pub publish --force

      - name: Publish zorphy
        if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/annotation-v')
        run: |
          cd zorphy
          # Retry logic for pub get to account for pub.dev indexing delays
          echo "Fetching dependencies (with retries for indexing delay)..."
          for i in {1..10}; do
            dart pub get && break || {
              if [ $i -lt 10 ]; then
                echo "Retrying in 30 seconds ($i/10)..."
                sleep 30
              else
                echo "Failed to resolve dependencies after 10 attempts."
                exit 1
              fi
            }
          done
          dart test
          dart pub publish --force
