name: CI Gate

on:
  pull_request:
    branches: [master]

jobs:
  version_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version sync
        run: bash scripts/check_version_sync.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: zorphy

  # Runs the shared pub-get + example build_runner work once and uploads the
  # whole workspace (incl. .dart_tool and generated sources) as an artifact so
  # the analyze/test/build_runner_smoke/analyzer_compat jobs can reuse it
  # instead of each repeating the 1-3 min codegen. The committed example
  # pubspec.lock pins identical resolution in every leg, so the artifact is
  # byte-identical for all consumers; analyzer_compat still re-resolves zorphy
  # itself with its pinned analyzer after restoring.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies (zorphy_annotation)
        run: dart pub get
        working-directory: zorphy_annotation
      - name: Install dependencies (zorphy)
        run: dart pub get
        working-directory: zorphy
      - name: Install dependencies (example)
        run: dart pub get
        working-directory: zorphy/example
      - name: Run build_runner (example)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: zorphy/example
      - name: Archive prepared workspace
        run: tar -czf prepared-workspace.tar.gz --exclude=.git .
      - name: Upload prepared workspace
        uses: actions/upload-artifact@v4
        with:
          name: prepared-workspace
          path: prepared-workspace.tar.gz
          retention-days: 1

  analyze:
    runs-on: ubuntu-latest
    needs: [version_sync, prepare]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          name: prepared-workspace
      - name: Restore prepared workspace
        run: tar -xzf prepared-workspace.tar.gz
      - name: Analyze (zorphy_annotation)
        run: dart analyze
        working-directory: zorphy_annotation
      - name: Analyze (zorphy)
        run: dart analyze
        working-directory: zorphy

  test:
    runs-on: ubuntu-latest
    needs: [version_sync, format, prepare]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          name: prepared-workspace
      - name: Restore prepared workspace
        run: tar -xzf prepared-workspace.tar.gz
      - name: Run tests (zorphy)
        run: dart test
        working-directory: zorphy

  build_runner_smoke:
    runs-on: ubuntu-latest
    needs: [version_sync, prepare]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          name: prepared-workspace
      - name: Restore prepared workspace
        run: tar -xzf prepared-workspace.tar.gz
      - name: Verify generated code analyzes clean
        run: dart analyze
        working-directory: zorphy/example

  analyzer_compat:
    runs-on: ubuntu-latest
    needs: [version_sync, prepare]
    strategy:
      fail-fast: false
      matrix:
        analyzer: ["13", "14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          name: prepared-workspace
      - name: Restore prepared workspace
        run: tar -xzf prepared-workspace.tar.gz
      - name: Pin analyzer ${{ matrix.analyzer }}.x
        working-directory: zorphy
        run: |
          if [ "${{ matrix.analyzer }}" = "14" ]; then
            printf 'dependency_overrides:\n  analyzer: ^14.0.0\n  json_serializable:\n    git:\n      url: https://github.com/google/json_serializable.dart\n      path: json_serializable\n' > pubspec_overrides.yaml
          else
            printf 'dependency_overrides:\n  analyzer: ^13.0.0\n' > pubspec_overrides.yaml
          fi
          cat pubspec_overrides.yaml
      - name: Install dependencies
        run: dart pub get
        working-directory: zorphy
      - name: Verify resolved analyzer major
        working-directory: zorphy
        run: |
          resolved=$(dart pub deps --style=compact | grep -m1 -o 'analyzer [0-9.]*' | awk '{print $2}')
          echo "resolved analyzer: $resolved"
          case "$resolved" in
            ${{ matrix.analyzer }}.*) echo "OK" ;;
            *) echo "expected analyzer ${{ matrix.analyzer }}.x, got $resolved"; exit 1 ;;
          esac
      - name: Analyze (analyzer ${{ matrix.analyzer }})
        run: dart analyze lib
        working-directory: zorphy
      - name: Run tests (analyzer ${{ matrix.analyzer }})
        run: dart test
        working-directory: zorphy

  migrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies (zorphy_migrator)
        run: dart pub get
        working-directory: zorphy_migrator
      - name: Analyze (zorphy_migrator)
        run: dart analyze
        working-directory: zorphy_migrator
      - name: Run tests (zorphy_migrator)
        run: dart test
        working-directory: zorphy_migrator
