name: CI Gate

on:
  pull_request:
    branches: [master]

jobs:
  version_sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ban Impl class and file names
        run: bash scripts/check_class_names.sh
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Check version sync
        run: bash scripts/check_version_sync.sh
      - name: Enforce lockfiles (each committed pubspec.lock must match its pubspec.yaml)
        run: |
          for pkg in zorphy_annotation zorphy zorphy_migrator zorphy/example; do
            echo "== $pkg"
            (cd "$pkg" && dart pub get --enforce-lockfile)
          done

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Resolve dependencies BEFORE formatting so the formatter sees a package
      # config pinning the package's declared language version (>=3.11 → tall
      # style), the same environment the release gate's format step creates after
      # its own `dart pub get` (scripts/publish.sh, pre_publish_gate). Without
      # this, the job has no package config, formats short-style, and disagrees
      # with the gate on the committed tall-style tree (issue #327).
      - name: Install dependencies (zorphy)
        run: dart pub get
        working-directory: zorphy
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: zorphy

  # Runs the shared pub-get + example build_runner work once and uploads the
  # whole workspace (incl. .dart_tool and generated sources) as an artifact so
  # the analyze/test/build_runner_smoke/analyzer_compat jobs can reuse it
  # instead of each repeating the 1-3 min codegen. The committed example
  # pubspec.lock pins identical resolution in every leg, so the artifact is
  # byte-identical for all consumers; analyzer_compat still re-resolves zorphy
  # itself with its pinned analyzer after restoring.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies (zorphy_annotation)
        run: dart pub get
        working-directory: zorphy_annotation
      - name: Install dependencies (zorphy)
        run: dart pub get
        working-directory: zorphy
      - name: Install dependencies (example)
        run: dart pub get
        working-directory: zorphy/example
      - name: Run build_runner (example)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: zorphy/example
      - name: Archive prepared workspace
        # The archive must live outside the tree being archived: creating it
        # inside "." changes the root dir's metadata mid-walk, and GNU tar
        # then fails with "tar: .: file changed as we read it".
        run: tar -czf "$RUNNER_TEMP/prepared-workspace.tar.gz" --exclude=.git .
      - name: Upload prepared workspace
        uses: actions/upload-artifact@v4
        with:
          name: prepared-workspace
          path: ${{ runner.temp }}/prepared-workspace.tar.gz
          retention-days: 1

  analyze:
    runs-on: ubuntu-latest
    needs: [version_sync, prepare]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          name: prepared-workspace
      - name: Restore prepared workspace
        run: tar -xzf prepared-workspace.tar.gz
      - name: Pin local zorphy_annotation
        working-directory: zorphy
        run: |
          printf 'dependency_overrides:\n  zorphy_annotation:\n    path: ../zorphy_annotation\n' > pubspec_overrides.yaml
          cat pubspec_overrides.yaml
      - name: Install dependencies (zorphy_annotation)
        run: dart pub get
        working-directory: zorphy_annotation
      - name: Install dependencies (zorphy)
        run: dart pub get
        working-directory: zorphy
      - name: Install dependencies (example)
        run: dart pub get
        working-directory: zorphy/example
      - name: Analyze (zorphy_annotation)
        run: dart analyze
        working-directory: zorphy_annotation
      - name: Analyze (zorphy)
        run: dart analyze
        working-directory: zorphy

  test:
    runs-on: ubuntu-latest
    needs: [version_sync, format, prepare]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          name: prepared-workspace
      - name: Restore prepared workspace
        run: tar -xzf prepared-workspace.tar.gz
      - name: Pin local zorphy_annotation
        working-directory: zorphy
        run: |
          printf 'dependency_overrides:\n  zorphy_annotation:\n    path: ../zorphy_annotation\n' > pubspec_overrides.yaml
          cat pubspec_overrides.yaml
      - name: Install dependencies (zorphy)
        run: dart pub get
        working-directory: zorphy
      - name: Run tests (zorphy)
        run: dart test
        working-directory: zorphy

  build_runner_smoke:
    runs-on: ubuntu-latest
    needs: [version_sync, prepare]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          name: prepared-workspace
      - name: Restore prepared workspace
        run: tar -xzf prepared-workspace.tar.gz
      - name: Install dependencies (example)
        run: dart pub get
        working-directory: zorphy/example
      - name: Verify generated code analyzes clean
        run: dart analyze
        working-directory: zorphy/example
      - name: Run example runtime tests (v3 union contract, issue #231)
        run: dart test
        working-directory: zorphy/example

  analyzer_compat:
    runs-on: ubuntu-latest
    needs: [version_sync, prepare]
    strategy:
      fail-fast: false
      matrix:
        analyzer: ["13", "14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          name: prepared-workspace
      - name: Restore prepared workspace
        run: tar -xzf prepared-workspace.tar.gz
      - name: Pin analyzer ${{ matrix.analyzer }}.x
        working-directory: zorphy
        run: |
          if [ "${{ matrix.analyzer }}" = "14" ]; then
            printf 'dependency_overrides:\n  zorphy_annotation:\n    path: ../zorphy_annotation\n  analyzer: ^14.0.0\n  json_serializable:\n    git:\n      url: https://github.com/google/json_serializable.dart\n      path: json_serializable\n' > pubspec_overrides.yaml
          else
            printf 'dependency_overrides:\n  zorphy_annotation:\n    path: ../zorphy_annotation\n  analyzer: ^13.0.0\n' > pubspec_overrides.yaml
          fi
          cat pubspec_overrides.yaml
      - name: Install dependencies
        run: dart pub get
        working-directory: zorphy
      - name: Verify resolved analyzer major
        working-directory: zorphy
        run: |
          resolved=$(dart pub deps --style=compact | grep -m1 -o 'analyzer [0-9.]*' | awk '{print $2}')
          echo "resolved analyzer: $resolved"
          case "$resolved" in
            ${{ matrix.analyzer }}.*) echo "OK" ;;
            *) echo "expected analyzer ${{ matrix.analyzer }}.x, got $resolved"; exit 1 ;;
          esac
      - name: Analyze (analyzer ${{ matrix.analyzer }})
        run: dart analyze lib
        working-directory: zorphy
      - name: Run tests (analyzer ${{ matrix.analyzer }})
        run: dart test
        working-directory: zorphy

  migrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies (zorphy_migrator)
        run: dart pub get
        working-directory: zorphy_migrator
      - name: Analyze (zorphy_migrator)
        run: dart analyze
        working-directory: zorphy_migrator
      - name: Run tests (zorphy_migrator)
        run: dart test
        working-directory: zorphy_migrator

  # Stacked-PR integrity gate (issue #315): the same check the pre-push hook
  # runs, exercised in CI so a force-push that orphans a merged PR's content is
  # caught even when a contributor never installed the hook. The gate's own
  # behaviour is covered by zorphy/test/release/stacked_pr_integrity_test.dart
  # (run in the test job); here we assert the scripts parse and the hook is wired.
  stacked_pr_integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts parse
        run: |
          bash -n scripts/check_stacked_pr_integrity.sh
          bash -n scripts/sweep_merged_content.sh
          bash -n scripts/git-hooks/pre-push
      - name: Hook and installer are executable in git
        # The pre-push gate only runs if git records the hook as executable;
        # a 100644 mode makes `git hook run pre-push` ignore it (issue #322).
        run: |
          for f in scripts/git-hooks/pre-push scripts/install_hooks.sh; do
            mode="$(git ls-tree HEAD -- "$f" | awk '{print $1}')"
            test "$mode" = "100755" || { echo "$f has mode $mode (expected 100755)"; exit 1; }
          done
      - name: Pre-push gate allows a clean tree (no orphaning refs on stdin)
        run: bash scripts/check_stacked_pr_integrity.sh </dev/null
