name: Dart CI

on:
  push:
    branches: [ master, main, development ]
  pull_request:
    branches: [ master, main, development ]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies (zorphy_annotation)
        run: dart pub get
        working-directory: zorphy_annotation

      - name: Analyze (zorphy_annotation)
        run: dart analyze
        working-directory: zorphy_annotation

      - name: Install dependencies (zorphy)
        run: dart pub get
        working-directory: zorphy

      - name: Install dependencies (example)
        run: dart pub get
        working-directory: zorphy/example

      - name: Run build_runner (example)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: zorphy/example

      - name: Install dependencies (test_cli_output)
        run: dart pub get
        working-directory: zorphy/test_cli_output

      - name: Run build_runner (test_cli_output)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: zorphy/test_cli_output

      - name: Analyze (zorphy)
        run: dart analyze
        working-directory: zorphy

      - name: Run tests (zorphy)
        run: dart test
        working-directory: zorphy

      - name: Analyze (example)
        run: dart analyze
        working-directory: zorphy/example

  analyzer_compat:
    # Verifies zorphy resolves, analyzes, and tests green against both
    # analyzer 13.x and 14.x (published constraint: >=13.0.0 <15.0.0).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        analyzer: ["13", "14"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Pin analyzer ${{ matrix.analyzer }}.x
        working-directory: zorphy
        run: |
          # TEMPORARY (analyzer 14 leg only): json_serializable <6.15 caps
          # analyzer <14.0.0; it is a dev-only dependency, so the override
          # below unblocks CI without touching the published constraint.
          # Remove once a json_serializable release supports analyzer 14.
          if [ "${{ matrix.analyzer }}" = "14" ]; then
            cat >> pubspec_overrides.yaml <<'EOF'
            analyzer: ^14.0.0
            json_serializable:
              git:
                url: https://github.com/google/json_serializable.dart
                path: json_serializable
          EOF
          else
            printf '  analyzer: ^13.0.0\n' >> pubspec_overrides.yaml
          fi
          cat pubspec_overrides.yaml

      - name: Install dependencies
        run: dart pub get
        working-directory: zorphy

      - name: Verify resolved analyzer major
        working-directory: zorphy
        run: |
          resolved=$(dart pub deps --style=compact | grep -m1 -o 'analyzer [0-9.]*' | awk '{print $2}')
          echo "resolved analyzer: $resolved"
          case "$resolved" in
            ${{ matrix.analyzer }}.*) echo "OK" ;;
            *) echo "expected analyzer ${{ matrix.analyzer }}.x, got $resolved"; exit 1 ;;
          esac

      - name: Analyze (analyzer ${{ matrix.analyzer }})
        run: dart analyze lib
        working-directory: zorphy

      - name: Run tests (analyzer ${{ matrix.analyzer }})
        run: dart test
        working-directory: zorphy

  migrator:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies (zorphy_migrator)
        run: dart pub get
        working-directory: zorphy_migrator

      - name: Analyze (zorphy_migrator)
        run: dart analyze
        working-directory: zorphy_migrator

      - name: Run tests (zorphy_migrator)
        run: dart test
        working-directory: zorphy_migrator
