name: zorphy_migrator
description: >-
  Codemod that migrates freezed model classes to zorphy using resolved AST
  analysis. Converts simple classes, sealed unions, @Default values, and
  @JsonKey annotations; reports anything that needs human attention.
version: 0.1.0
homepage: https://github.com/arrrrny/zorphy

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  analyzer: ">=14.0.0 <15.0.0"
  args: ^2.6.0
  path: ^1.9.1
  collection: ^1.19.1
  zorphy_annotation: ^2.0.0

dev_dependencies:
  freezed_annotation: ^3.1.0
  test: ^1.31.1

dependency_overrides:
  zorphy_annotation:
    path: ../zorphy_annotation

executables:
  zorphy_migrator: zorphy_migrator
