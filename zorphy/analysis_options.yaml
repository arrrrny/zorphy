# Type-safety floor for downstream ecosystem consumers.
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  exclude:
    - "**/*.g.dart"
    - "**/*.zorphy.dart"
    - "**/*.zorphy2.dart"
    # v2 migration fixtures are intentionally not analyzable: they carry the
    # pre-v3 `@ZorphySealed` / `@Zorphy(preset: ...)` surface the codemod
    # rewrites, which the v3 annotation package no longer defines.
    - "test/migration/fixtures/**"
    # The #234 cost-guard fixtures + runner reference `build_runner`-generated v3
    # classes (`_br_/benchmark/cost_guard_fixtures.part.dart`) that do not exist
    # on a fresh checkout — the `analyze` CI job runs `dart analyze` without a
    # benchmark codegen step. Like the migration fixtures, they are compiled at
    # runtime by the benchmark launcher (which runs generation first), not by
    # static analysis; the launcher and the reliability primitives beside them
    # stay analyzed.
    - "benchmark/cost_guard_fixtures.dart"
    - "benchmark/cost_guards_runner.dart"
    # The #252 structural probe imports the same build_runner-generated v3
    # fixtures (`benchmark/cost_guard_fixtures.dart` →
    # `_br_/benchmark/cost_guard_fixtures.part.dart`) that do not exist on a
    # fresh checkout, so `dart analyze` without a benchmark codegen step sees
    # the generated classes (`Product`, `ProductPatch`, `UiNode`, …) as
    # undefined. Like the cost-guard fixtures it is compiled at runtime by its
    # launcher (`deterministic_structural_guards_test.dart`, which runs
    # generation first and stays analyzed), not by static analysis.
    - "test/audit/_structural_probe.dart"

linter:
  rules:
    # Correctness rules the current package already satisfies.
    - throw_in_finally
    - unrelated_type_equality_checks
    - avoid_empty_else
    - valid_regexps
    - await_only_futures
    # Enabled after the dead v2 layer was removed; all remaining hits were fixed.
    - prefer_final_locals
    - avoid_dynamic_calls
    - file_names
