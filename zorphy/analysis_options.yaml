analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.zorphy.dart"
    - "**/*.zorphy2.dart"
    # v2 migration fixtures are intentionally not analyzable: they carry the
    # pre-v3 `@ZorphySealed` / `@Zorphy(preset: ...)` surface the codemod
    # rewrites, which the v3 annotation package no longer defines.
    - "test/migration/fixtures/**"
    # The #234 cost-guard fixtures + impl reference `build_runner`-generated v3
    # classes (`_br_/benchmark/cost_guard_fixtures.part.dart`) that do not exist
    # on a fresh checkout — the `analyze` CI job runs `dart analyze` without a
    # benchmark codegen step. Like the migration fixtures, they are compiled at
    # runtime by the benchmark launcher (which runs generation first), not by
    # static analysis; the launcher and the reliability primitives beside them
    # stay analyzed.
    - "benchmark/cost_guard_fixtures.dart"
    - "benchmark/cost_guards_impl.dart"
