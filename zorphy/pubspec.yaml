name: zorphy
description: A powerful code generation package for Dart/Flutter that provides clean class definitions with copyWith, JSON serialization, toString, equality, and inheritance support
version: 3.0.0
homepage: https://github.com/arrrrny/zorphy

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  zorphy_annotation: ^3.0.0
  analyzer: ^14.0.0
  # build 5.x is required by build_runner 2.17.x; source_gen 4.3.1 already
  # allows it (build >=3.0.2 <6.0.0), so only this pin needed widening.
  build: ">=4.0.4 <6.0.0"
  source_gen: ^4.3.1
  dartx: ^1.2.0
  quiver: ^3.2.2
  path: ^1.9.1
  collection: ^1.19.1
  # `built_collection` 6.0.0 is reached through a development-only git override
  # on `built_value`, because 8.13.0 still pins `^5.0.0` and is the sole
  # blocker: code_builder 4.13.0, build_runner 2.17.1 and build_daemon 4.1.7 all
  # already allow >=5.1.1 <7.0.0, so waiting on code_builder would never release
  # it. The widening is proposed in google/built_value.dart#1406; drop the
  # `built_value` block from pubspec_overrides.yaml once a release carries it.
  # Nothing here changes for consumers — pub ignores that file.
  code_builder: ^4.10.0
  dart_style: ^3.1.1
  args: ^2.6.0
  glob: ^2.1.2
  watcher: ^1.1.1
  meta: ">=1.17.0 <2.0.0"

dev_dependencies:
  build_runner: ^2.17.1
  json_serializable: ^6.14.0
  json_annotation: ^4.12.0
  pub_semver: ^2.2.0
  test: ^1.31.1
  yaml: ^3.1.3

executables:
  zorphy: zorphy_cli
  zorphy_mcp_server: zorphy_mcp_server
