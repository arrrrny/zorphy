targets:
  $default:
    builders:
      zorphy:zorphy:
        enabled: true

builders:
  # Single unified builder (since 2.0): one PartBuilder pass per library
  # handles both @Zorphy and @Zorphy2 annotations and resolves polymorphic
  # ordering internally — the former second pass (zorphy2) no longer exists.
  zorphy:
    target: "zorphy"
    import: "package:zorphy/builder.dart"
    builder_factories: ["zorphyBuilder"]
    build_extensions: { ".dart": [".zorphy.dart"] }
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]
    runs_before: ["json_serializable:json_serializable"]
