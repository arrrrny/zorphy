targets:
  $default:
    builders:
      zorphy:zorphy:
        enabled: true

builders:
  # Shared-part builder (since 3.0.0): one colocated `<library>.zorphy.dart`
  # per library (issue #309), written as a plain `build_to: source` output.
  # This is deliberately NOT `adds_to_library` — build_runner forces that
  # output under its reserved `_br_/` tree regardless of the consumer's `part`
  # directive, which is the mirror tree #309 retires. The `.zorphy.dart`
  # extension below is the real on-disk file name, colocated with the source
  # library it extends.
  # Handles the zero-preset v3 archetype annotations and resolves polymorphic
  # ordering internally (topological order over the implements $$Base graph).
  zorphy:
    target: "zorphy"
    import: "package:zorphy/builder.dart"
    builder_factories: ["zorphyBuilder"]
    build_extensions: { ".dart": [".zorphy.dart"] }
    auto_apply: dependents
    build_to: source
    runs_before: ["json_serializable:json_serializable"]