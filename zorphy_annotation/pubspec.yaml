name: zorphy_annotation
description: Annotations for zorphy code generation package that provides clean class definitions with copyWith, JSON serialization, toString, equality, and inheritance support
version: 3.0.0
homepage: https://github.com/arrrrny/zorphy

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  # `ZorphyIntentDigest` hashes the canonical intent payload with SHA-256
  # (issue #189). This is the one external dependency the v3 surface keeps:
  # the #176 zero-dependency gate is reconciled against the SHA-256/runtime
  # requirement in #175 (a reviewed amendment — see CHANGELOG / #175).
  crypto: ^3.0.7
dev_dependencies:
  test: ^1.33.0
