name: zorphy_annotation
description: Annotations for zorphy code generation package that provides clean class definitions with copyWith, JSON serialization, toString, equality, and inheritance support
version: 3.0.0-dev.2
homepage: https://github.com/arrrrny/zorphy

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  # `ZorphyIntentDigest` hashes the canonical intent payload with SHA-256
  # (issue #189). `json_annotation` provides `@JsonKey`, the v3 field-level
  # wire annotation the generator reads by name (zorphy #88) and the migrator
  # emits — re-exported so the documented single import resolves it. The
  # #176 zero-dependency gate is reconciled against these runtime
  # requirements in #175 (a reviewed amendment — see CHANGELOG / #175).
  crypto: ^3.0.7
  json_annotation: ^4.12.0
dev_dependencies:
  test: ^1.33.0
